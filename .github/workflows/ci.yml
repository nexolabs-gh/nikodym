name: CI

"on":
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install tooling
        run: uv sync --locked --python 3.12 --group lint --extra ui

      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      HYPOTHESIS_PROFILE: ci
    strategy:
      fail-fast: false
      # SDD-25 §7: matriz base v0.1.0 en Linux/macOS/Windows para Python 3.11-3.13.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install test dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --group test --extra scoring

      - name: Pytest
        run: uv run --no-sync pytest -q --cov=nikodym --cov-report=term-missing

  test-all:
    name: Tests all extras
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install all extras
        run: uv sync --locked --python 3.12 --extra all --group test

      - name: Pytest
        run: uv run --no-sync pytest -q --cov=nikodym --cov-report=term-missing

  test-pdf:
    name: PDF extra (WeasyPrint tests reales)
    # Extra `pdf` fuera del cierre redistribuible (WeasyPrint→Pyphen roza GPL); solo Linux en B4.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install WeasyPrint native deps
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 libffi-dev

      - name: Install pdf extra
        run: uv sync --locked --python 3.12 --extra pdf --group test

      - name: PDF tests reales (WeasyPrint)
        run: uv run --no-sync python -m pytest tests/unit/test_report_pdf.py -q

  coverage-regulatory:
    name: Regulatory coverage
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install test dependencies
        run: uv sync --locked --python 3.12 --group test --extra scoring

      - name: Coverage regulatorio
        shell: bash
        run: |
          regulatory_include="$(
            uv run --no-sync python -c \
              "from nikodym.testing.regulatory import regulatory_coverage_include_arg; print(regulatory_coverage_include_arg())"
          )"
          uv run --no-sync coverage run -m pytest
          uv run --no-sync coverage report --include="$regulatory_include" --fail-under=100

  frontend:
    name: Frontend reproducible y licencias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Activar Corepack
        run: corepack enable

      - name: Instalar con lock congelado
        working-directory: web
        run: |
          test "$(node --version)" = "v$(cat ../.node-version)"
          test "$(pnpm --version)" = "11.15.0"
          pnpm install --frozen-lockfile

      - name: Calidad y tests frontend
        working-directory: web
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build demo aislado
        working-directory: web
        shell: bash
        run: |
          find ../src/nikodym/ui/static -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/static-before-demo
          demo_dir="$(mktemp -d)"
          NIKODYM_DEMO_OUT_DIR="$demo_dir" pnpm build:demo
          test -f "$demo_dir/index.html"
          find ../src/nikodym/ui/static -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/static-after-demo
          diff -u /tmp/static-before-demo /tmp/static-after-demo

      - name: Regenerar bundle normal dos veces
        working-directory: web
        shell: bash
        run: |
          pnpm build:package
          find ../src/nikodym/ui/static -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/static-build-1
          sha256sum dist/evidence/frontend-provenance.json > /tmp/provenance-build-1
          pnpm build:package
          find ../src/nikodym/ui/static -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/static-build-2
          sha256sum dist/evidence/frontend-provenance.json > /tmp/provenance-build-2
          diff -u /tmp/static-build-1 /tmp/static-build-2
          diff -u /tmp/provenance-build-1 /tmp/provenance-build-2

      - name: Inventarios y gates supply-chain
        working-directory: web
        shell: bash
        run: |
          mkdir -p dist/evidence
          pnpm licenses list --json --long > dist/evidence/frontend-licenses.full.raw.json
          pnpm licenses list --prod --json --long > dist/evidence/frontend-licenses.prod.raw.json
          pnpm test:supply-chain
          node ../scripts/check_frontend_bundle.mjs
          node ../scripts/check_frontend_licenses.mjs

      - name: Build versionado sin drift
        shell: bash
        run: |
          git diff --exit-code -- src/nikodym/ui/static
          git status --porcelain --untracked-files=all -- src/nikodym/ui/static > /tmp/static-status
          test ! -s /tmp/static-status

      - name: Subir evidencia frontend autoritativa
        uses: actions/upload-artifact@v4
        with:
          name: frontend-candidate-evidence
          path: web/dist/evidence/
          if-no-files-found: error

      - name: Subir evidencia diagnóstica si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence-diagnostic
          path: web/dist/evidence/
          if-no-files-found: warn

  build:
    name: Build
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Descargar evidencia frontend autoritativa
        uses: actions/download-artifact@v4
        with:
          name: frontend-candidate-evidence
          path: candidate/frontend-evidence

      - name: Verificar evidencia descargada
        run: test -f candidate/frontend-evidence/frontend-provenance.json

      - name: Build distributions
        run: uv build

      - name: Verify candidate unit and frontend provenance
        shell: bash
        run: |
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          uv run --no-sync python scripts/check_distribution_contents.py \
            --frontend-provenance candidate/frontend-evidence/frontend-provenance.json \
            "${wheels[0]}" "${sdists[0]}"

      - name: Rebuild wheel from sdist and revalidate
        shell: bash
        run: |
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          mkdir -p dist/from-sdist
          uv build --wheel --out-dir dist/from-sdist "${sdists[0]}"
          rebuilt=(dist/from-sdist/*.whl)
          test "${#rebuilt[@]}" -eq 1
          uv run --no-sync python scripts/check_distribution_contents.py \
            --frontend-provenance candidate/frontend-evidence/frontend-provenance.json \
            --reference-wheel "${wheels[0]}" \
            "${rebuilt[0]}" "${sdists[0]}"

      - name: Smoke test wheel
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv run --isolated --no-project --with "${wheels[0]}" \
            python -c "import nikodym; print(nikodym.__version__)"

      # El gate que faltaba. El resto del CI corre con `uv sync --locked`: prueba el uv.lock, no lo
      # que recibe el usuario. Aquí se instala el wheel con **pip resolviendo libre**, igual que un
      # `pip install nikodym[...]` desde PyPI, y se corre el preset estándar de punta a punta.
      #
      # No es teórico: hasta la 1.1.1, pip traía scikit-learn 1.9 (que eliminó el `force_all_finite`
      # que optbinning invoca) y pandas 3.0 (que rompe la serialización), y la primera corrida de
      # cualquier usuario nuevo moría — con el CI entero en verde. `import nikodym` seguía
      # funcionando, que es justo lo que el smoke anterior verificaba.
      - name: Smoke de instalación real (pip, resolución libre)
        shell: bash
        run: |
          python -m venv .venv-pip
          ./.venv-pip/bin/pip install --quiet --upgrade pip
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          ./.venv-pip/bin/pip install --quiet "${wheels[0]}[scoring,ui,docx]" httpx2
          ./.venv-pip/bin/pip list | grep -Ei "^(nikodym|pandas|scikit-learn|numpy|optbinning) "
          ./.venv-pip/bin/python scripts/smoke_instalacion_pip.py

      - name: Verify wheel license metadata
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv run --isolated --no-project python - "${wheels[0]}" <<'PY'
          from __future__ import annotations

          import email.parser
          import sys
          import zipfile
          from pathlib import Path

          wheel_path = Path(sys.argv[1])
          with zipfile.ZipFile(wheel_path) as wheel:
              metadata_name = next(
                  name for name in wheel.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = email.parser.Parser().parsestr(
                  wheel.read(metadata_name).decode("utf-8")
              )

          license_expression = metadata.get("License-Expression")
          if license_expression != "Apache-2.0":
              raise SystemExit(
                  "License-Expression inválida en el wheel: "
                  f"{license_expression!r}; esperado 'Apache-2.0'."
              )
          PY

      - name: Export runtime dependency closure
        run: uv export --format requirements-txt --extra all --no-dev > dist/runtime-requirements.txt

      - name: Install runtime dependency closure
        run: uv sync --locked --python 3.12 --extra all --no-dev

      - name: Verify runtime licenses
        run: >-
          uv run --no-sync python scripts/check_runtime_licenses.py
          dist/runtime-requirements.txt dist/license-report.json

      # El gate de arriba es hermético (offline): clasifica los pines no instalables aquí contra la
      # copia vendorizada y hasheada de su core metadata. Este paso es el que además confirma que esa
      # copia sigue siendo byte a byte lo que PyPI publica. Va SEPARADO y con red propia para que un
      # timeout de PyPI no vuelva flaky al gate de aprobación, pero NO es opcional: sin `if:` ni
      # `continue-on-error`, un fallo aquí rompe el job igual que cualquier otro.
      - name: Verify vendored license evidence against PyPI
        run: >-
          uv run --no-sync python scripts/check_runtime_licenses.py
          --verify-sources
          dist/runtime-requirements.txt dist/license-report.verify.json

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: dist/license-report.json
          if-no-files-found: error

      - name: Ensamblar candidate y evidencia como unidad
        shell: bash
        run: |
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          mkdir -p dist/candidate-unit/frontend-evidence
          cp "${wheels[0]}" "${sdists[0]}" dist/license-report.json \
            dist/runtime-requirements.txt scripts/runtime_license_allowlist.json \
            dist/candidate-unit/
          cp -R candidate/frontend-evidence/. dist/candidate-unit/frontend-evidence/
          # La allowlist referencia por ruta+sha256 la core metadata vendorizada de los pines que no
          # son instalables en el runner; sin ella el candidate cita evidencia que no viaja y nadie
          # puede reproducir la clasificación desde el artefacto. Entra al SHA256SUMS de abajo.
          cp -R scripts/runtime_license_metadata dist/candidate-unit/runtime_license_metadata
          (
            cd dist/candidate-unit
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload candidate distributions
        uses: actions/upload-artifact@v4
        with:
          name: candidate-distributions-with-evidence
          path: dist/candidate-unit/
          if-no-files-found: error

  lock-check:
    name: Lock check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Check lockfile
        run: uv lock --check
