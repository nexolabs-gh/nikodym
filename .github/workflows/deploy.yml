name: Deploy

# Publica `docs.nikodym.cl` y `demo.nikodym.cl` cuando `main` pasa TODOS los gates.
#
# 🔴 Por qué existe. Hasta el 2026-08-07 los dos sitios se publicaban A MANO por Vercel, y el paso
# se olvidó: `docs.nikodym.cl` sirvió `1.2.0` durante **nueve releases** —sin cuatro páginas que
# llevaban hasta 12 días en el repo, incluida `avisos-declarados.md`— y `demo.nikodym.cl` quedó
# **171 commits y 4 releases atrás**, publicando el titular «provisiones CMF de Chile» que la
# decisión del 2026-08-05 había retirado del repo. Nada avisó en ningún momento.
#
# ⚠️ Y la lección de método: **no faltaba un gate, faltaba el paso de publicar.** El contenido ya
# estaba vigilado —`test_docs_site_cifras.py:192` ata el titular de versión de la portada a
# `__version__`, y las firmas de los fixtures atan la demo a sus corridas—, así que un gate nuevo
# habría repetido lo que el repo ya sabía. Lo que no existía era el mecanismo que lleva eso a
# producción. Por eso esto es un deploy y no un test.
#
# Se despliegan LOS DOS SIEMPRE, sin filtro por rutas. Un filtro reintroduce la forma de
# equivocarse que este workflow existe para cerrar: basta que alguien toque una ruta que el filtro
# no contempla —`src/` alimenta la referencia de API por mkdocstrings, por ejemplo— para que la
# deriva vuelva en silencio. Construir de más es barato; publicar de menos es lo que costó 12 días.

"on":
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar docs y demo
    runs-on: ubuntu-latest
    # 🔴 La condición es lo que impide publicar basura: sólo corre si el run de CI que lo disparó
    # terminó en `success`, o sea con todos sus jobs verdes. `workflow_run` se dispara igual cuando el
    # CI falla, así que sin este `if` un commit rojo se publicaría.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production
    # 🔴 En un evento `workflow_run`, `github.sha` es la punta de la rama por defecto y NO el commit
    # cuyo CI disparó este job (hallazgo de la revisión adversarial de la 1.14.0, pasada 4): el
    # checkout ya usaba `workflow_run.head_sha`, pero el sello y el chequeo en vivo miraban
    # `github.sha`, así que un CI atrasado podía publicar A y certificar B. Un solo SHA para todo.
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Comprobar que las credenciales están configuradas
        # Falla PRIMERO y con un mensaje que dice qué hacer, en vez de dejar que el CLI de Vercel
        # reviente doce pasos más abajo con «Error: No existing credentials found». Y falla en vez
        # de saltarse el deploy: un `skip` se lee igual que un verde, que es exactamente cómo este
        # sitio derivó nueve releases sin que nadie lo notara.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          faltan=()
          [ -n "${VERCEL_TOKEN:-}" ] || faltan+=("secret VERCEL_TOKEN")
          [ -n "${{ vars.VERCEL_ORG_ID }}" ] || faltan+=("variable VERCEL_ORG_ID")
          [ -n "${{ vars.VERCEL_DOCS_PROJECT_ID }}" ] || faltan+=("variable VERCEL_DOCS_PROJECT_ID")
          [ -n "${{ vars.VERCEL_DEMO_PROJECT_ID }}" ] || faltan+=("variable VERCEL_DEMO_PROJECT_ID")
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error::Falta configurar: ${faltan[*]}"
            echo "El token se crea en https://vercel.com/account/tokens (scope: NexoLabs Projects)"
            echo "y se instala con:  gh secret set VERCEL_TOKEN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `workflow_run` da por defecto la punta de la rama, que puede haber avanzado mientras el
          # CI corría. Se publica EXACTAMENTE el commit que pasó los gates.
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      # Un CI que termina después de que `main` avanzó no debe promover a producción un commit
      # que ya no es la punta: se sale limpio y el Deploy del commit nuevo hace el trabajo.
      - name: Sólo la punta de main llega a producción
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          punta="$(git rev-parse origin/main)"
          if [ "$punta" != "$DEPLOY_SHA" ]; then
            echo "::notice::este CI es de ${DEPLOY_SHA:0:7} y main ya está en ${punta:0:7}: no se despliega"
            echo "SALTAR=1" >> "$GITHUB_ENV"
          fi

      - name: Setup uv
        if: env.SALTAR != '1'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        if: env.SALTAR != '1'
        run: uv python install 3.12

      - name: Instalar dependencias de documentación
        if: env.SALTAR != '1'
        run: uv sync --locked --python 3.12 --group docs

      # 🔴 Frescura de la documentación (pasada 3 de la revisión adversarial de la 1.14.0): varios
      # commits comparten versión y la portada no distingue un deploy sólo de docs del anterior. El
      # sitio publica la huella del commit que lo construyó (`build-sha.txt`, un archivo estático
      # más de `docs_site/`, creado sólo aquí) y el chequeo en vivo la espera antes de dar por
      # verde el despliegue.
      - name: Sellar el sitio con la huella del commit
        if: env.SALTAR != '1'
        run: printf '%s\n' "$DEPLOY_SHA" > docs_site/build-sha.txt

      - name: Construir el sitio de documentación
        if: env.SALTAR != '1'
        # `--strict` es el mismo gate que corre en local: un enlace roto aborta antes de publicar.
        run: uv run --no-sync mkdocs build --strict

      - name: Setup Node
        if: env.SALTAR != '1'
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Activar Corepack
        if: env.SALTAR != '1'
        run: corepack enable

      - name: Instalar con lock congelado
        if: env.SALTAR != '1'
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Construir la demo estática
        if: env.SALTAR != '1'
        working-directory: web
        run: pnpm build:demo

      - name: Instalar Vercel CLI
        if: env.SALTAR != '1'
        run: npm install --global vercel@56

      - name: Publicar docs.nikodym.cl
        if: env.SALTAR != '1'
        working-directory: site
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_DOCS_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN"

      - name: Publicar demo.nikodym.cl
        if: env.SALTAR != '1'
        working-directory: web/dist
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_DEMO_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN"

      - name: Verificar EN VIVO lo publicado
        if: env.SALTAR != '1'
        # 🔴 Un deploy que devuelve `READY` no prueba que el dominio sirva lo nuevo. Se comprueba
        # contra el dominio real y por CONTENIDO, no por código de estado: la versión que la portada
        # de la doc afirma tiene que ser la que el paquete declara, y el titular que se retiró del
        # repo no puede seguir vivo en la demo. Es el par de afirmaciones que estuvieron falsas.
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -oE '__version__ = "[^"]+"' src/nikodym/__init__.py | cut -d'"' -f2)"

          # 🔴 Frescura antes que contenido (hallazgo de la revisión adversarial de la 1.14.0): el
          # alias de producción de Vercel tarda más que un `sleep` fijo, y un chequeo que lea el
          # build ANTERIOR pasa en falso —o falla en falso— sin acreditar este commit. El bundle
          # que este job construyó lleva un hash en el nombre: se sondea el dominio, con plazo,
          # hasta que sirva exactamente ese archivo; y la portada, hasta que diga esta versión.
          bundle_local="$(grep -oE '/assets/index-[^"]*\.js' web/dist/index.html | head -1)"
          test -n "$bundle_local" || { echo "::error::web/dist/index.html no referencia ningún bundle"; exit 1; }
          limite=$(( SECONDS + 10 * 60 ))
          while :; do
            bundle_vivo="$(curl -fsSL -H 'Cache-Control: no-cache' https://demo.nikodym.cl/ | grep -oE '/assets/index-[^"]*\.js' | head -1 || true)"
            docs="$(curl -fsSL -H 'Cache-Control: no-cache' https://docs.nikodym.cl/ || true)"
            sha_vivo="$(curl -fsSL -H 'Cache-Control: no-cache' https://docs.nikodym.cl/build-sha.txt | tr -d '[:space:]' || true)"
            if [ "$bundle_vivo" = "$bundle_local" ] && [ "$sha_vivo" = "$DEPLOY_SHA" ] && grep -qF "Estado: ${version}" <<<"$docs"; then
              echo "producción sirve este build: ${bundle_local}, docs ${sha_vivo:0:7} y la portada ${version}"
              break
            fi
            if [ "$SECONDS" -ge "$limite" ]; then
              echo "::error::producción no sirvió este build en 10 min (demo=${bundle_vivo:-∅} esperado=${bundle_local}; docs=${sha_vivo:-∅} esperado=${DEPLOY_SHA})"
              exit 1
            fi
            sleep 15
          done

          docs="$(curl -fsSL -H 'Cache-Control: no-cache' https://docs.nikodym.cl/)"
          if ! grep -qF "Estado: ${version}" <<<"$docs"; then
            echo "::error::docs.nikodym.cl no publica la versión ${version} en su portada"
            exit 1
          fi
          for pagina in norma-local avisos-declarados guias/puerta-artefactos \
                        guias/provision-sin-norma-local guias/gobernanza; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://docs.nikodym.cl/${pagina}/")"
            test "$code" = "200" || { echo "::error::${pagina} devuelve ${code}"; exit 1; }
          done

          bundle="$(curl -fsSL https://demo.nikodym.cl/ | grep -oE '/assets/index-[^"]*\.js' | head -1)"
          test -n "$bundle" || { echo "::error::demo.nikodym.cl no sirve ningún bundle"; exit 1; }
          cuerpo="$(curl -fsSL "https://demo.nikodym.cl${bundle}")"
          if grep -qF "provisiones CMF de Chile" <<<"$cuerpo"; then
            echo "::error::la demo publica el titular con jurisdicción que se retiró del repo"
            exit 1
          fi
          grep -qF "La normativa local se aterriza encima" <<<"$cuerpo" || {
            echo "::error::la demo no publica el subtítulo vigente"; exit 1; }

          # 🔴 D-JUR-9.8: la demo dejó de PUBLICAR la corrida del caso de referencia (F3), y eso se
          # verifica por la CORRIDA, no por las cadenas del front. Ese front conserva a propósito
          # el rótulo «Provisiones CMF» (`CONFIG_SECTIONS`, D-JUR-9.5), el id
          # `f3-provisiones-consumo` (`CURATED`) y el título de la sección en `schema.json`:
          # exigir su ausencia literal bloquearía todo deploy conforme. Lo que sólo existía en los
          # fixtures F3 es esta identidad, y sus archivos ya salieron del árbol —de ahí los
          # literales—. `pnpm check:demo-bundle` corre lo mismo en local, antes de llegar aquí.
          for retirado in df491df8bb1e48c9a40bbbe474a97938 \
                          857b06eef5aff267c36076641ffbdbf2fb17836511c206ea04fc5c160983886d; do
            if grep -qF "$retirado" <<<"$cuerpo"; then
              echo "::error::la demo publica la corrida F3, retirada del catálogo por D-JUR-9.7 (${retirado:0:16}…)"
              exit 1
            fi
          done
          # Y la mitad positiva, sin la cual un bundle vacío pasaría por «limpio»: las dos corridas
          # que la demo sí publica tienen que estar. Son los `run_id` de `results-f1.json` y
          # `results-ifrs9.json`; `test_deploy_publica_las_corridas_de_la_demo.py` los ata a los
          # fixtures versionados, así que una recaptura mueve los dos lados en el mismo commit.
          for publicado in d97078b0b27549ff83a950ff119fbdb4 \
                           cf27b0c47bcb430eaeae51b87a8355bb; do
            grep -qF "$publicado" <<<"$cuerpo" || {
              echo "::error::la demo no publica la corrida ${publicado:0:16}…: el bundle no sirve ningún ejemplo"
              exit 1; }
          done

          echo "docs y demo verificados en vivo contra ${version}"
